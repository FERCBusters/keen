# Opt into local builds: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  keen-api:
    image: keen-api:local
    build:
      context: ./services/api
  keen-worker:
    image: keen-api:local
    build:
      context: ./services/api
  keen-beat:
    image: keen-api:local
    build:
      context: ./services/api
  keen-ui:
    image: keen-ui:local
    build:
      context: .
      dockerfile: services/ui/Dockerfile
