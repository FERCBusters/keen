# Add the audit stream in Admin → Sources & Evidence Mapping → By source.
# An empty list collects nothing.
ui_name: Cloudflare
badge_color: "#F38020"
streams: []
# How far back the first run reads. Cloudflare keeps audit logs for 18 months.
initial_lookback_days: 30
# The log is read in windows of this many hours, oldest first.
window_hours: 24
# Each window reaches back this far, for entries Cloudflare lists late.
overlap_minutes: 60
# Pages in one run; a run that reaches the limit keeps its place.
max_pages: 100
# Entries asked for in each page, at most 1000.
page_size: 500
