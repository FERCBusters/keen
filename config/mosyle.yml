# Add the adminlogs stream in Admin → Sources & Evidence Mapping → By source.
# An empty list collects nothing.
ui_name: Mosyle
badge_color: "#00A1DE"
streams: []
# How far back the first run reads.
initial_lookback_days: 30
# The log is read in windows of this many hours, oldest first.
window_hours: 24
# Each window reaches back this far, for logs Mosyle lists late.
overlap_minutes: 60
# Pages in one run; a run that reaches the limit keeps its place.
max_pages: 100
