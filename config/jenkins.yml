# Jenkins polling config.
# Jenkins exposes a REST-like "Remote Access API" with JSON under .../api/json
# Use 'tree' to fetch only what you need (reduces payload).

jobs:
  - name: "Deploy-to-production"
    label: "production"
    kind: "deploy"
  - name: "Deploy-to-staging"
    label: "staging"
    kind: "deploy"
  - name: "Backup_Jenkins"
    label: "operations"
    kind: "backup"
  - name: "Database_Backup_production"
    label: "production"
    kind: "backup"
  - name: "Test-staging"
    label: "qa"
    kind: "test"
  - name: "SSL_Tests"
    label: "security"
    kind: "test"
  - name: "Static_Analysis_On_Staging"
    label: "qa"
    kind: "test"
  - name: "Github_Org_Check_Permissions"
    label: "security"
    kind: "test"
  - name: "Jenkins_Check_Permissions"
    label: "security"
    kind: "test"
  - name: "ECS_Tasks_Rebalance"
    label: "operations"
    kind: "high_availability"      
