    reason: General risks should still be assessed against policy, ownership, monitoring, and response controls.

impact_flags:
  sensitive_data:
    label: Sensitive or customer data could be exposed
    risk_types: [Confidentiality]
    mitigation_words: [classification, labelling, access, encryption, cryptography, transfer, leakage, privacy, threat intelligence]
    reason: Sensitive data exposure points to confidentiality and data protection controls.
  data_corruption:
    label: Data could be corrupted or made unreliable
    risk_types: [Integrity]
    mitigation_words: [change, configuration, logging, monitoring, backup, testing, review]
    reason: Corruption or unreliable data points to integrity controls and recoverability.
  service_outage:
    label: A service could be interrupted or unavailable
    risk_types: [Availability]
    mitigation_words: [backup, capacity, continuity, incident, monitoring, network, resilience]
    reason: Outages point to availability, continuity, and detection controls.
  financial:
    label: Direct financial or cost impact is likely
    risk_types: []
    mitigation_words: [supplier, project, capacity, continuity, monitoring, review, responsibilities]
    reason: Financial impact benefits from governance, supplier, and continuity mitigations.
  brand:
    label: Brand or reputation could be damaged
    risk_types: []
    mitigation_words: [incident, response, authorities, communication, monitoring, event, intelligence]
    reason: Reputational impact depends on good detection, response, and communications.
  supplier:
    label: A supplier or third party is involved
    risk_types: []
    mitigation_words: [supplier, cloud, agreement, service, monitoring, review, access, relationship]
    reason: Supplier involvement points to third-party relationship, agreement, and monitoring controls.
  compliance:
    label: Compliance or audit readiness could be affected
    risk_types: []
    mitigation_words: [legal, statutory, regulatory, evidence, records, compliance, audit, review]
    reason: Compliance impact points to legal, records, evidence, and auditability controls.

scenario_terms:
  supplier:
    terms: [supplier, vendor, third party, third-party, processor, outsource, outsourced, cloud provider, saas]
    mitigation_words: [supplier, cloud, agreement, service, monitoring, review, access, relationship]
    reason: The issue mentions a supplier or third party.
  identity_access:
    terms: [password, mfa, multifactor, login, account, credential, authentication, authorisation, authorization, privileged, admin]
    mitigation_words: [identity, authentication, access, rights, privileged, secrets]
    reason: The issue mentions identity, account, or privileged access concerns.
  malware_ransomware:
    terms: [malware, ransom, ransomware, virus, phishing, malicious, compromise, compromised, crack, cracking, decrypt, decryption, decrypted, dark web]
    mitigation_words: [malware, backup, monitoring, incident, awareness, vulnerability, threat intelligence]
    reason: The issue mentions malware or compromise indicators.
  logging_monitoring:
    terms: [log, logs, logging, audit trail, monitoring, alert, detection, forensic]
    mitigation_words: [logging, monitoring, event, clock, audit, response]
    reason: The issue mentions detection, logging, or auditability.
  change_config:
    terms: [change, deployment, release, configuration, misconfiguration, patch, update, drift]
    mitigation_words: [change, configuration, secure development, testing, review, vulnerability]
    reason: The issue mentions change, configuration, or release risk.
  backup_recovery:
    terms: [backup, restore, recovery, retention, lost data, data loss, archive]
    mitigation_words: [backup, restore, availability, continuity, deletion, retention]
    reason: The issue mentions backup, recovery, or data loss.

