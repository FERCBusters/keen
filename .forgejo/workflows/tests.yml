name: KEEN CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: docker.io/library/debian:13
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: keen_test
          POSTGRES_PASSWORD: keen_test
          POSTGRES_DB: keen_test
        options: >-
          --health-cmd "pg_isready -U keen_test -d keen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: docker.io/valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHON_BIN: python3
      POETRY_VERSION: "2.4.1"
      KEEN_TEST_DATABASE_URL: postgresql+psycopg2://keen_test:keen_test@postgres:5432/keen_test
      KEEN_REDIS_URL: redis://valkey:6379/0
      TZ: UTC

    steps:
      - name: Install system dependencies
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git tar gzip findutils bash nodejs \
            python3 python3-venv python3-pip build-essential poppler-utils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Poetry
        run: |
          set -eu
          "${PYTHON_BIN}" -m venv /opt/keen-ci-poetry
          /opt/keen-ci-poetry/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo /opt/keen-ci-poetry/bin >> "$GITHUB_PATH"
          /opt/keen-ci-poetry/bin/poetry --version

      - name: Install locked application and test dependencies
        run: |
          set -eu
          if [ -f keen/services/api/pyproject.toml ]; then cd keen; fi
          cd services/api
          poetry env use "${PYTHON_BIN}"
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Run tests
        run: |
          set -eu
          if [ -f keen/tests.sh ]; then cd keen; fi
          bash tests.sh

      - name: Upload test results
        if: ${{ always() }}
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: keen-test-results
          path: |
            test-results/
            keen/test-results/
          if-no-files-found: warn

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.NODERED_WEBHOOK_URL }}
          REPOSITORY: ${{ forgejo.repository }}
          RUN_NUMBER: ${{ forgejo.run_number }}
          SERVER_URL: ${{ forgejo.server_url }}
        run: |
          set -eu
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "Failure webhook is not configured; skipping notification."
            exit 0
          fi
          "${PYTHON_BIN}" - <<'PY' > /tmp/keen-ci-notification.json
          import json, os
          e = os.environ
          print(json.dumps({
              "repository": e["REPOSITORY"], "run_number": e["RUN_NUMBER"],
              "status": "failure",
              "url": f'{e["SERVER_URL"]}/{e["REPOSITORY"]}/actions/runs/{e["RUN_NUMBER"]}'
          }))
          PY
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/keen-ci-notification.json "$WEBHOOK_URL"
