repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: frontend-format
        name: Format first-party JavaScript and CSS
        entry: bash format-ui.sh --write
        language: system
        files: '^services/ui/.*\.(js|mjs|css)$'
        exclude: '/(vendor|node_modules|dist)/|\.min\.(js|css)$'
      - id: frontend-html-insertion
        name: Check first-party JavaScript for unescaped HTML insertion
        entry: bash lint-ui.sh --check
        language: system
        pass_filenames: false
        files: '^(services/ui/public/.*\.js|services/ui/tests/(eslint\.config\.js|eslint-suppressions\.json|package(-lock)?\.json)|lint-ui\.sh)$'
        exclude: '/(vendor|node_modules|dist)/'
      - id: python-types
        name: Check Python types
        entry: bash -c 'cd services/api && poetry run mypy'
        language: system
        pass_filenames: false
        files: '^services/api/(app/.*\.py|pyproject\.toml|poetry\.lock)$'
