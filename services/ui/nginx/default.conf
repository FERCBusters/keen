# NOTE: this file is included from nginx.conf inside the http {} context.

# WebSocket upgrade helper
map $http_upgrade $keen_upgrade {
  default "";
  websocket "websocket";
}

map $http_upgrade $keen_connection {
  default "close";
  websocket "upgrade";
}

# Security headers: only add if upstream didn't set them (avoid duplication)
# $upstream_http_<header-name> contains the header value from upstream, or empty if not present
map $upstream_http_x_content_type_options $x_content_type_options_value {
  default "";
  "" "nosniff";
}

map $upstream_http_x_frame_options $x_frame_options_value {
  default "";
  "" "SAMEORIGIN";
}

map $upstream_http_x_xss_protection $x_xss_protection_value {
  default "";
  "" "1; mode=block";
}

map $upstream_http_referrer_policy $referrer_policy_value {
  default "";
  "" "strict-origin-when-cross-origin";
}

map $upstream_http_x_permitted_cross_domain_policies $x_permitted_cross_domain_policies_value {
  default "";
  "" "none";
}

map $upstream_http_cross_origin_opener_policy $cross_origin_opener_policy_value {
  default "";
  "" "same-origin";
}

map $upstream_http_cross_origin_embedder_policy $cross_origin_embedder_policy_value {
  default "";
  "" "require-corp";
}

map $upstream_http_strict_transport_security $strict_transport_security_value {
  default "";
  "" "max-age=31536000; includeSubDomains; preload";
}

map $upstream_http_content_security_policy $content_security_policy_value {
  default "";
  "" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 40M;

  # Hide server information
  server_tokens off;

  # Security headers: only added if upstream (API) didn't set them
  # For static assets (no upstream), these will be applied
  # For API responses, upstream headers take precedence
  add_header X-Content-Type-Options $x_content_type_options_value always;
  add_header X-Frame-Options $x_frame_options_value always;
  add_header X-XSS-Protection $x_xss_protection_value always;
  add_header Referrer-Policy $referrer_policy_value always;
  add_header X-Permitted-Cross-Domain-Policies $x_permitted_cross_domain_policies_value always;
  add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy_value always;
  add_header Cross-Origin-Embedder-Policy $cross_origin_embedder_policy_value always;
  add_header Strict-Transport-Security $strict_transport_security_value always;
  add_header Content-Security-Policy $content_security_policy_value always;

  # API upstream (resolved at request time to avoid startup DNS races)
  set $keen_api "http://keen-api:8080";


  # ---------------------------------------------------------------------------
  # Auth gate for HTML pages (cookie-based sessions)
  # ---------------------------------------------------------------------------

  # Subrequest endpoint used by auth_request.
  location = /_auth_check {
    internal;

    proxy_pass $keen_api/v1/auth/check;
    proxy_http_version 1.1;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do not forward user-controlled identity headers. Native OIDC relies on
    # KEEN's own HttpOnly session cookie, not REMOTE_USER.
    proxy_set_header REMOTE_USER "";

    # Never trust user-supplied X-Keen-* headers from the client.
    proxy_set_header X-Keen-User "";
    proxy_set_header X-Keen-Role "";

    # Forward browser cookies to the API (session id).
    proxy_set_header Cookie $http_cookie;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  # Admin-only auth check used to hide admin UI routes. This avoids nginx `if`
  # ordering pitfalls (rewrite phase vs access phase) and ensures the decision
  # comes from the API's user role data (not a hard-coded nginx map).
  location = /_auth_check_admin {
    internal;

    proxy_pass $keen_api/v1/auth/check-admin;
    proxy_http_version 1.1;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do not forward user-controlled identity headers. Native OIDC relies on
    # KEEN's own HttpOnly session cookie, not REMOTE_USER.
    proxy_set_header REMOTE_USER "";

    # Never trust user-supplied X-Keen-* headers from the client.
    proxy_set_header X-Keen-User "";
    proxy_set_header X-Keen-Role "";

    proxy_set_header Cookie $http_cookie;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  # Internal helper used to return 404 for non-admin users.
  location = /_admin_404 {
    internal;
    return 404;
  }

  # Login page must be reachable without auth.
  location = /login.html { try_files $uri =404; }
  location = /pages/login.js { try_files $uri =404; }

  # Static assets (no auth gate).
  #
  # During development, the UI is frequently rebuilt and deployed without
  # fingerprinted asset names. Force revalidation for core JS/CSS so browsers
  # don't keep using stale modules (which can look like "changes didn't apply").
  location ^~ /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /styles.css {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location = /app.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location ^~ /pages/ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Admin UI (hide unless the authenticated user is an admin)
  location = /admin.html {
    auth_request /_auth_check_admin;
    error_page 401 =403 /login.html;
    error_page 403 =404 /_admin_404;
    try_files $uri =404;
  }

  location = /pages/admin.js {
    auth_request /_auth_check_admin;
    error_page 401 =403 /login.html;
    error_page 403 =404 /_admin_404;
    try_files $uri =404;
  }

  # API proxy (no nginx auth gate; API enforces its own auth)
  location ^~ /api/ {
    rewrite ^/api/?(.*)$ /$1 break;

    proxy_pass $keen_api;
    proxy_http_version 1.1;

    # WebSocket support (admin notifications, etc.)
    proxy_set_header Upgrade $keen_upgrade;
    proxy_set_header Connection $keen_connection;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do not forward user-controlled identity headers. Native OIDC relies on
    # KEEN's own HttpOnly session cookie, not REMOTE_USER.
    proxy_set_header REMOTE_USER "";

    # Never trust user-supplied X-Keen-* headers from the client.
    proxy_set_header X-Keen-User "";
    proxy_set_header X-Keen-Role "";

    # Forward browser cookies through to the API.
    proxy_set_header Cookie $http_cookie;

    proxy_connect_timeout 3s;
    proxy_read_timeout 3600s;
  }

  # Root: treat as a page and gate with auth.
  location = / {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files $uri $uri/ /index.html;
  }

  # All other .html pages require auth.
  location ~* \.html$ {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files $uri =404;
  }

  # Everything else (unknown paths) falls back to index, but still gated.
  location / {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files $uri $uri/ /index.html;
  }
}
