<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Keen - Home</title>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/demo-notice.js" defer></script>
</head>
<body data-page="home">
  <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
  <div id="navbar"></div>

  <main id="main-content" class="container container-tight py-4 keen-home">
    <div class="d-flex flex-wrap gap-3 align-items-start justify-content-between mb-3">
      <div class="home-heading">
        <h1 class="h3 mb-1">Home</h1>
        <div class="small-muted">Coverage and open work for the framework selected in the navigation menu.</div>
        <div class="home-framework-label mt-2"><i class="bi bi-collection" aria-hidden="true"></i><span id="homeFrameworkName">Loading framework</span></div>
      </div>
      <form hidden id="homeSearch" class="home-search no-print" role="search">
        <label class="form-label small fw-semibold mb-1" for="homeQ">Search evidence in this framework</label>
        <div class="input-group">
          <input id="homeQ" class="form-control" type="search" placeholder="Search events">
          <button class="btn btn-primary" type="submit" aria-label="Search evidence"><i class="bi bi-search" aria-hidden="true"></i></button>
        </div>
      </form>
    </div>

    <div id="status" class="alert alert-info" style="display:none;" role="status"></div>

    <div id="homeOverview" class="mb-4">
      <section id="homeKpis" class="home-overview-grid mb-3" aria-label="Framework overview" aria-live="polite"></section>
      <section id="homeActivity" class="card mb-3" hidden aria-labelledby="homeActivityTitle">
        <div class="card-body home-activity-body">
          <div class="home-activity-spark">
            <div class="d-flex align-items-baseline justify-content-between gap-2">
              <h2 id="homeActivityTitle" class="h6 mb-0">Evidence activity</h2>
              <span class="small-muted">Last 30 days</span>
            </div>
            <div id="homeSpark" class="home-spark" role="img" aria-label="Evidence collected over the last 30 days"></div>
            <p id="homeSparkNote" class="small text-secondary mb-0">Loading evidence activity</p>
          </div>
          <div id="homeActivitySources" class="home-activity-sources" hidden>
            <h3 class="h6 mb-2">Busiest sources</h3>
            <ul id="homeSources" class="home-source-list list-unstyled mb-2"></ul>
            <p id="homeSourcesMore" class="mb-0"></p>
          </div>
        </div>
      </section>
      <div class="row g-3"><section class="col-12 col-lg-5" aria-labelledby="homeTasksTitle"><div class="card h-100"><div class="card-body"><h2 id="homeTasksTitle" class="h5">Shortcuts</h2><div id="homeTasks" class="home-task-grid"></div></div></div></section>
      <section class="col-12 col-lg-7" aria-labelledby="homeAttentionTitle"><div class="card h-100"><div class="card-body"><div class="d-flex align-items-center justify-content-between gap-2"><h2 id="homeAttentionTitle" class="h5 mb-0">Needs attention</h2><button id="homeRefresh" class="btn btn-sm btn-outline-secondary" type="button">Refresh</button></div><div id="homeAttention" class="mt-3" aria-live="polite"><p class="small-muted">Loading overview</p></div></div></div></section></div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/pages/home.js"></script>
</body>
</html>
