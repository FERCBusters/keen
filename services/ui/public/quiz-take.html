<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Keen - Quiz</title>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/demo-notice.js" defer></script>
</head>
<body data-page="quiz-take">
  <div id="navbar"></div>

  <main class="container container-tight py-4">
    <div class="small-muted mb-1"><a class="link-subtle" href="/account.html#my-quizzes">← My quizzes</a></div>
    <div class="d-flex flex-wrap gap-2 align-items-start justify-content-between mb-3">
      <div>
        <h1 class="h3 mb-1" id="quizTitle">Quiz</h1>
        <div class="small-muted" id="quizMeta" hidden>Loading the quiz</div>
      </div>
      <div class="text-end small-muted" id="timerWrap" hidden><i class="bi bi-stopwatch me-1" aria-hidden="true"></i><span id="timer" aria-live="off">0:00</span></div>
    </div>

    <div id="status" class="alert alert-info" style="display:none;"></div>

    <section id="sitting" hidden>
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
            <span class="fw-semibold" id="pageLabel">Page 1</span>
            <span class="small-muted" id="answeredLabel">0 answered</span>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="Questions answered" id="answeredBar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" style="width:0%"></div></div>
          <div class="quiz-dots" id="dots" aria-hidden="true"></div>
        </div>
      </div>
      <form id="pageForm" class="vstack gap-3" novalidate>
        <div id="questions" class="vstack gap-3"></div>
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <button class="btn btn-outline-secondary" type="button" id="back"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back</button>
          <span class="small-muted" id="saveNote">Your answers are saved each time you move to the next page.</span>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit" id="next">Save and continue<i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></button>
            <button class="btn btn-success" type="button" id="handIn" hidden><i class="bi bi-send-check me-1" aria-hidden="true"></i>Hand in</button>
          </div>
        </div>
      </form>
    </section>

    <section id="result" hidden>
      <div class="card mb-3">
        <div class="card-body text-center">
          <div id="mascot"></div>
          <h2 class="h3 mt-3 mb-1" id="resultHeading">Handed in</h2>
          <div id="resultScore" class="mb-2"></div>
          <div class="small-muted" id="resultNote"></div>
          <div class="mt-3" id="reward"></div>
        </div>
      </div>
      <div class="card" id="reviewCard" hidden>
        <div class="card-header"><div class="fw-bold">Your answers</div><div class="small-muted" id="reviewNote"></div></div>
        <div class="card-body vstack gap-3" id="review"></div>
      </div>
    </section>
  </main>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/pages/quiz-take.js"></script>
</body>
</html>
