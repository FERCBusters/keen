<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Keen – Access Control Matrix Row</title>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body data-page="isms-access">
  <div id="navbar"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
      <div>
        <div class="small-muted mb-1"><a class="link-subtle" data-nav-fw="1" href="/isms.html?tab=access">← Access Control Matrix</a></div>
        <h1 class="h3 mb-1" id="accessTitle">Access control row</h1>
        <div class="small-muted" id="accessMeta">Loading access control row…</div>
      </div>
      <div class="d-flex flex-wrap gap-2 no-print">
        <button id="sampleAccessAudit" class="btn btn-outline-success" type="button" style="display:none;"><i class="bi bi-clipboard2-plus me-1" aria-hidden="true"></i>Sample into audit</button>
        <a id="editAccessLink" class="btn btn-primary" data-nav-fw="1" href="/isms.html?tab=access">Edit row</a>
      </div>
    </div>

    <div id="status" class="alert alert-info" style="display:none;"></div>

    <ul class="nav nav-tabs mb-3 no-print" id="accessTabs" role="tablist">
      <li class="nav-item" role="presentation"><button class="nav-link active" id="accessDetailsTab" data-bs-toggle="tab" data-bs-target="#accessDetailsPane" type="button" role="tab">Details</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" id="accessChangelogTab" data-bs-toggle="tab" data-bs-target="#accessChangelogPane" type="button" role="tab">Changelog</button></li>
    </ul>

    <div class="tab-content" id="accessTabContent">
      <section class="tab-pane fade show active" id="accessDetailsPane" role="tabpanel" tabindex="0">
        <div class="row g-3">
          <div class="col-12 col-xl-8">
            <div class="vstack gap-3">
              <div class="card">
                <div class="card-header fw-bold">Task / Action</div>
                <div id="accessTask" class="card-body whitespace-pre-wrap">Loading…</div>
              </div>
              <div class="card">
                <div class="card-header fw-bold">Notes</div>
                <div id="accessNotes" class="card-body whitespace-pre-wrap small-muted">Loading…</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="card">
              <div class="card-header fw-bold">Access details</div>
              <div class="card-body">
                <dl class="row mb-0">
                  <dt class="col-sm-5">Service</dt><dd class="col-sm-7" id="accessService">—</dd>
                  <dt class="col-sm-5">Managed hosting accounts</dt><dd class="col-sm-7" id="accessAccounts">—</dd>
                  <dt class="col-sm-5">Status</dt><dd class="col-sm-7" id="accessStatusValue">—</dd>
                  <dt class="col-sm-5">Approved by</dt><dd class="col-sm-7" id="accessApprovedBy">—</dd>
                  <dt class="col-sm-5">Roles</dt><dd class="col-sm-7" id="accessRoles">—</dd>
                  <dt class="col-sm-5">Updated</dt><dd class="col-sm-7" id="accessUpdated">—</dd>
                </dl>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="tab-pane fade" id="accessChangelogPane" role="tabpanel" tabindex="0">
        <div id="accessChangelog" class="card card-body small-muted">Loading changelog…</div>
      </section>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/pages/isms-access.js"></script>
</body>
</html>
