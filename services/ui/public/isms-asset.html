<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Keen – ISMS Asset</title>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body data-page="isms-asset">
  <div id="navbar"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
      <div>
        <div class="small-muted mb-1"><a class="link-subtle" data-nav-fw="1" href="/isms.html?tab=assets">← Asset Matrix</a></div>
        <h1 class="h3 mb-1" id="assetTitle">Asset</h1>
        <div class="small-muted" id="assetMeta">Loading asset…</div>
      </div>
      <div class="d-flex flex-wrap gap-2 no-print">
        <button id="sampleAssetAudit" class="btn btn-outline-success" type="button" style="display:none;"><i class="bi bi-clipboard2-plus me-1" aria-hidden="true"></i>Sample into audit</button>
        <a id="editAssetLink" class="btn btn-primary" data-nav-fw="1" href="/isms.html?tab=assets">Edit asset</a>
      </div>
    </div>

    <div id="status" class="alert alert-info" style="display:none;"></div>

    <ul class="nav nav-tabs mb-3 no-print" id="assetTabs" role="tablist">
      <li class="nav-item" role="presentation"><button class="nav-link active" id="assetDetailsTab" data-bs-toggle="tab" data-bs-target="#assetDetailsPane" type="button" role="tab">Details</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" id="assetChangelogTab" data-bs-toggle="tab" data-bs-target="#assetChangelogPane" type="button" role="tab">Changelog</button></li>
    </ul>

    <div class="tab-content" id="assetTabContent">
      <section class="tab-pane fade show active" id="assetDetailsPane" role="tabpanel" tabindex="0">
        <div class="row g-3">
          <div class="col-12 col-xl-8">
            <div class="vstack gap-3">
              <div class="card">
                <div class="card-header fw-bold">Description</div>
                <div id="assetDescription" class="card-body whitespace-pre-wrap small-muted">Loading…</div>
              </div>
              <div class="card">
                <div class="card-header fw-bold">Linked controls and clauses</div>
                <div class="card-body">
                  <h2 class="h6">Controls</h2>
                  <div class="mb-3" id="assetControls">Loading controls…</div>
                  <h2 class="h6">Clauses</h2>
                  <div id="assetClauses">Loading clauses…</div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-12 col-xl-4">
            <div class="card">
              <div class="card-header fw-bold">Asset details</div>
              <div class="card-body">
                <dl class="row mb-0">
                  <dt class="col-sm-5">Category</dt><dd class="col-sm-7" id="assetCategory">—</dd>
                  <dt class="col-sm-5">Subcategory</dt><dd class="col-sm-7" id="assetSubcategory">—</dd>
                  <dt class="col-sm-5">License</dt><dd class="col-sm-7" id="assetLicense">—</dd>
                  <dt class="col-sm-5">Owner</dt><dd class="col-sm-7" id="assetOwner">—</dd>
                  <dt class="col-sm-5">Register held by</dt><dd class="col-sm-7" id="assetRegister">—</dd>
                  <dt class="col-sm-5">CIA risks</dt><dd class="col-sm-7" id="assetRiskCount">—</dd>
                  <dt class="col-sm-5">Updated</dt><dd class="col-sm-7" id="assetUpdated">—</dd>
                </dl>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="tab-pane fade" id="assetChangelogPane" role="tabpanel" tabindex="0">
        <div id="assetChangelog" class="card card-body small-muted">Loading changelog…</div>
      </section>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/pages/isms-asset.js"></script>
</body>
</html>
