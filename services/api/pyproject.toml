[tool.poetry]
name = "keen-api"
version = "0.1.0"
description = "Keen API (FastAPI)"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
uvicorn = { version = "^0.53.0", extras = ["standard"] }
pydantic = "^2"
pydantic-core = "^2.47"
pydantic-settings = "^2.14"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1"
httpx = "^0.28.1"
authlib = "^1.7"
pyyaml = "^6.0.3"
boto3 = "^1"
celery = "^5.6"
redis = "^8"
python-dateutil = "2.9.0.post0"
python-multipart = "0.0.32"
google-api-python-client = "^2"
google-auth = "^2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
