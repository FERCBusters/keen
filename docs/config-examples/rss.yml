# Generic RSS / Atom ingestion configuration
#
# This is intended to cover "everything else" that isn't a first-class
# provider in Keen. You can ingest:
#   - internal blog/news feeds
#   - status pages that expose Atom/RSS
#   - vendor advisories / security bulletins
#   - custom application feeds
#
# Notes:
#   - Entries are de-duplicated by (feed_url + entry_id/guid/link).
#   - Each ingested entry stores a JSON artifact (normalized feed+entry data).
#   - A per-feed cursor uses conditional GET (ETag/Last-Modified) when available.
#
# feeds:
#   - name: "Security advisories"
#     label: "SecAdvisory"
#     system: "Security"
#     url: "https://example.com/security/atom.xml"
#     enabled: true
#     max_items: 50
#     overlap_minutes: 2880          # default: 2 days
#     verify_tls: true               # default: KEEN_RSS_VERIFY_TLS
#     headers:
#       X-Api-Key: "..."             # optional
#     auth:
#       username: "..."             # optional Basic Auth
#       password: "..."

feeds:
  - name: "Github Incidents"
    label: "Github Incidents"
    system: "Github"
    url: "https://www.githubstatus.com/history.rss"
    enabled: true
  - name: "Google Incidents"
    label: "Google Incidents"
    system: "Google"
    url: "https://www.google.com/appsstatus/dashboard/en-GB/feed.atom"
    enabled: true
  - name: "AWS Security Incidents"
