  # --- Forgejo: means Ansible, Tofu
  - id: "forgejo_feed_general"
    description: "Forgejo feed: configuration management, infra as code"
    when:
      source: "forgejo"
    map_to: ["A.8.9","A.8.32"]
    confidence: 0.35

  # --- Taiga (tickets, incidents, change requests) ---
  - id: "taiga_incident_or_security"
    description: "Taiga incident/security work items: incident management lifecycle evidence."
    when:
      source: "taiga"
      summary_regex: "(?i)incident|sev|postmortem|security|breach|vulnerab|cve|malware|phish|compromis|unauthori|exploit"
    map_to: ["A.5.24","A.5.25","A.5.26","A.5.27","A.5.28","A.6.8","A.8.8"]
    confidence: 0.75

  - id: "taiga_supplier_services_monitoring"
    description: "Taiga work items tagged with AWS supplier service identifiers: monitoring/review/change management of supplier services."
    when:
      source: "taiga"
      # Matches specific supplier identifiers embedded in the story subject.
      summary_regex: "\\b(474516947344|348692936236|208021331467|496953747852)\\b"
    map_to: ["A.5.22"]
    confidence: 0.90

  - id: "taiga_icinga_events"
    description: "Icinga alerts arriving in Tracker"
    when:
      source: "taiga"
      summary_regex: "(?i)warning|critical|down"
      system_regex: "(?i)infrastructure"
    map_to: ["A.8.16"]
    confidence: 0.75      

  - id: "taiga_new_packages"
    description: "Taiga work item mentioned new software upgrades available"
    when:
      source: "taiga"
      summary_regex: '\bAMI\b|OpenTofu|codeberg|docker\.io|lscr'
    map_to: ["A.8.19","A.8.32"]
    confidence: 0.75

  - id: "taiga_general_activity_tracking"
    description: "General Taiga activity: evidence that projects are tracked/communicated via a controlled system."
    when:
      source: "taiga"
    map_to: ["A.5.8"]
    confidence: 0.35

  - id: "taiga_change_events"
    description: "Taiga change/release work items indicating change management."
    when:
      source: "taiga"
      summary_regex: "(?i)change|update|upgrade|patch|deploy|release|rollout|hotfix|rollback|maintenance|config|migration|refactor|feature|bugfix|fix\\b"
    map_to: ["A.8.32"]
    confidence: 0.55

  - id: "taiga_threat_intelligence"
    description: "Threat Intelligence, Early Warning System and inventory with NCSC"
    when:
      source: "taiga"
      summary_regex: "(?i)ncsc"
    map_to: ["A.5.5","A.5.6","A.5.7","A.5.9"]
    confidence: 0.55

  # --- Diary entries ---
  - id: "diary_dr_test"
    description: "Diary: DR test performed."
    when:
      source: "diary"
      summary_regex: "(?i)\bDR\b|disaster recovery|restore test|failover test|quarterly"
    map_to: ["A.5.29","A.5.30","A.8.13","A.8.14"]
    confidence: 0.80

  # --- RSS events
  - id: "rss_security_and_status"
    description: "Match RSS items from either Security or Status feeds"
    when:
      source: "rss"
      system_regex: "(?i)^(AWS|Github|Google)$"
    map_to: ["A.5.19","A.5.22","A.5.23"]
    confidence: 0.60

  - id: "linux_security_patch_notifications"
    description: "Linux Security Patch Notifications"
    when:
      source: "rss"
      system_regex: "(?i)^(Ubuntu|ALAS)$"
    map_to: ["A.5.19","A.5.22","A.5.23","A.8.8"]
    confidence: 0.75

  # --- Google Workspace events
  # ------------------------------------------------------------
  # Admin audit stream (system: gws_admin)
  # ------------------------------------------------------------

  - id: "gws_admin_user_created"
    description: "Google Workspace (Admin): user account created (identity provisioning evidence)"
    when:
      source: "google_workspace"
      system: "gws_admin"
      action_regex: "(?i)(^|\\+)CREATE_USER(\\+|$)"
    map_to: ["A.5.16", "A.5.18"]
    confidence: 0.75

  - id: "gws_admin_user_deleted"
    description: "Google Workspace (Admin): user account deleted (deprovisioning / access removal)"
    when:
      source: "google_workspace"
      system: "gws_admin"
      action_regex: "(?i)(^|\\+)DELETE_USER(\\+|$)"
    map_to: ["A.5.16", "A.5.18"]
    confidence: 0.80

  - id: "gws_admin_user_suspended_or_restored"
    description: "Google Workspace (Admin): user suspended/unsuspended (access enable/disable)"
    when:
      source: "google_workspace"
      system: "gws_admin"
      action_regex: "(?i)(^|\\+)(SUSPEND_USER|UNSUSPEND_USER)(\\+|$)"
    map_to: ["A.5.18"]
    confidence: 0.70

  - id: "gws_admin_user_renamed_or_moved_ou"
    description: "Google Workspace (Admin): rename / OU move (account administration evidence)"
    when:
      source: "google_workspace"
      system: "gws_admin"
      action_regex: "(?i)(^|\\+)(RENAME_USER|MOVE_USER_TO_ORG_UNIT)(\\+|$)"
    map_to: ["A.5.16"]
    confidence: 0.60

  - id: "gws_admin_password_changed_or_reset"
    description: "Google Workspace (Admin): password changed/reset (authentication information management)"
    when:
      source: "google_workspace"
      system: "gws_admin"
      action_regex: "(?i)(^|\\+)(CHANGE_USER_PASSWORD|RESET_PASSWORD|SET_PASSWORD)(\\+|$)"
    map_to: ["A.5.17", "A.5.18"]
    confidence: 0.70

  - id: "gws_admin_2sv_or_security_setting_changed"
