# Suggested rules for Keen for sysadmin / CI/CD / SDLC evidence
# IMPORTANT: Review with your ISMS owner/auditor and tune for your environment.
# These rules assume you imported ISO27001:2022 Annex A refs like "A.8.32" etc.

# Multi-framework mapping patterns supported:
#
# 1) Legacy (applies to rule/framework context):
#    map_to: ["A.8.15", "A.8.16"]
#
# 2) Framework map:
#    map_to:
#      ISO27001:2022: ["A.8.15", "A.8.16"]
#      UK-DVSTF:1.0: ["11.8.1.a", "11.8.1.b"]
#
# 3) Target objects with optional role gating:
#    map_to:
#      - framework: "ISO27001:2022"
#        ref: "A.8.15"
#      - framework: "UK-DVSTF:1.0"
#        refs: ["11.8.1.a", "11.8.1.b"]
#        roles_any: ["ops", "security"]
#
rules:
  - id: "ossec_ssh_failed"
    description: "OSSEC: Failed SSH login attempts"
    when:
      source: "loki"
      system: "ossec"
      action: "ssh_login"
      outcome: "failed"
    map_to: ["A.5.15","A.5.17","A.8.3","A.8.5","A.8.15","A.8.16","A.8.27"]
    confidence: 0.75

  - id: "ossec_ssh_success"
    description: "OSSEC: Successful SSH logins"
    when:
      source: "loki"
      system: "ossec"
      action: "ssh_login"
      outcome: "success"
    map_to: ["A.8.2","A.8.15","A.8.27"]
    confidence: 0.55

  - id: "ossec_sudo_usage"
    description: "OSSEC: sudo usage (privileged command execution)"
    when:
      source: "loki"
      system: "ossec"
      action: "sudo"
      outcome: "executed"
    map_to: ["A.8.2", "A.8.15", "A.8.16", "A.8.18"]
    confidence: 0.70

  - id: "ossec_command_exec"
    description: "OSSEC: user executed a command. Tamper-proof log of evidence"
    when:
      source: "loki"
      system: "ossec"
      action: "command_exec"
    map_to: ["A.8.2","A.8.15","A.8.16","A.8.27"]
    confidence: 0.70

  - id: "ossec_patching"
    description: "OSSEC: patching activity"
    when:
      source: "loki"
      system: "ossec"
      action: "patching"
    map_to: ["A.8.8","A.8.9","A.8.15","A.8.18","A.8.19"]
    confidence: 0.75

  - id: "ossec_web_sec_logs"
    description: "OSSEC: web security logs"
    when:
      source: "loki"
      system: "ossec"
      action: "web_sec_event"
    map_to: ["A.8.15","A.8.16","A.8.20","A.8.21"]
    confidence: 0.70

  - id: "ossec_rootkit_scan_alert"
    description: "OSSEC: rootcheck rootkit scan alert"
    when:
      source: "loki"
      system: "ossec"
      action: "rootkit_sec_event"
    map_to: ["A.8.7"]
    confidence: 0.25

  #- id: "ossec_alerts_all"
  #  description: "OSSEC: general alerts (broad evidence of monitoring/logging)"
  #  when:
  #    source: "loki"
  #    system: "ossec"
  #    action: "alert"
  #    outcome: "alert"
  #  map_to: ["A.8.15","A.8.16"]
  #  confidence: 0.35

  - id: "ossec_config_management"
    description: "OSSEC: evidence of config management playbooks"
    when:
      source: "loki"
      system: "ossec"
      action: "config_management"
      outcome: "info"
    map_to: ["A.8.9","A.8.32"]
    confidence: 0.75

  - id: "vpn_use_network_secure_controls"
    description: "Use of secure VPN to access segregated networks remotely"
    when:
      source: "loki"
      system: "network"
      action: "vpn"
      outcome: "info"
    map_to: ["A.8.16","A.8.20","A.8.21","A.8.22","A.8.24"]
    confidence: 0.75

  - id: "clock_synchronisation"
    description: "Use of NTP protocol for Clock Synchronisation"
    when:
      source: "loki"
      system: "network"
      action: "clock_sync"
      outcome: "info"
    map_to: ["A.8.17"]
    confidence: 0.75

  - id: "quad_9_web_filtering"
    description: "DNS-level protection against malware sites via Quad 9 web filtering"
    when:
      source: "loki"
      system: "network"
      action: "web_filtering_dns"
      outcome: "info"
    map_to: ["A.8.7","A.8.23"]
    confidence: 0.75

  - id: "firewall_block_event"
    description: "Software firewall blocking packets"
    when:
      source: "loki"
      system: "network"
      action: "web_filtering_event"
      outcome: "info"
    map_to: ["A.8.15","A.8.16","A.8.20","A.8.21","A.8.23"]
    confidence: 0.60

  # --- Jenkins (CI/CD) ---
  # Deploy: success = strong SDLC + change mgmt + environment separation evidence
  - id: "jenkins_deploy_success"
    description: "Jenkins deploy job succeeded: controlled change + SDLC."
    when:
      source: "jenkins"
      action: "deploy"
      outcome: "success"
    map_to: ["A.8.31", "A.8.25"]
    confidence: 0.75

  - id: "jenkins_deploy_failed"
    description: "Jenkins deploy job failed: change attempt + monitoring/response trigger."
    when:
      source: "jenkins"
      action: "deploy"
      outcome: "failed"
    map_to: ["A.8.25","A.8.31"]
    confidence: 0.55

  # Optional: explicit env separation evidence by label
  - id: "jenkins_env_separation_labels"
    description: "Jenkins deployments by environment."
    when:
      source: "jenkins"
      action: "deploy"
      system_regex: "(?i)^(dev|staging|production)$"
    map_to: ["A.8.31"]
    confidence: 0.60

  # Backup jobs
  - id: "jenkins_backup_success"
    description: "Jenkins backup job succeeded: information backup + ICT readiness for business continuity."
    when:
      source: "jenkins"
      action: "backup"
      outcome: "success"
    map_to: ["A.8.13", "A.5.30"]
    confidence: 0.80
      
  - id: "jenkins_backup_running"
    description: "Jenkins backup job running: information backup + ICT readiness for business continuity."
    when:
      source: "jenkins"
      action: "backup"
      outcome: "info"
    map_to: ["A.8.13", "A.5.30"]
    confidence: 0.80

  - id: "jenkins_backup_failed"
    description: "Jenkins backup job failed: backup control evidence + monitoring/response signal."
    when:
      source: "jenkins"
      action: "backup"
      outcome: "failed"
    map_to: ["A.8.13", "A.5.30"]
    confidence: 0.65

  # Backup testing / DR readiness
  - id: "jenkins_backup_testing"
    description: "Test_Backups / restore-style jobs: stronger ICT readiness evidence (backup verification)."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)\\btest_backups\\b|restore\\s*test|backup\\s*test"
    map_to: ["A.5.30", "A.8.13"]
    confidence: 0.85

  - id: "jenkins_infrastructure_as_code_testing"
    description: "Infrastructure as code testing: provisioning/config of cloud services, secret scanning, network exposure testing, best practices"
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)tfsec"
    map_to: ["A.5.23","A.8.21", "A.8.25"]
    confidence: 0.50

  # General tests = test information + SDLC
  - id: "jenkins_tests_general"
    description: "Test jobs executed: evidence for test information and SDLC quality gates."
    when:
      source: "jenkins"
      action: "test"
    map_to: ["A.8.33", "A.8.25"]
    confidence: 0.50

  # Security testing in dev/acceptance (A.8.29) - detect by job name in summary
  - id: "jenkins_security_testing"
    description: "Security test/scanning jobs (SAST/DAST/scanners) executed."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)zap|ssl_tests|trivy|sonar|static_analysis|security"
    map_to: ["A.8.29", "A.8.25", "A.8.28"]
    confidence: 0.70

  # Routine scanning/testing of TLS/cipher strength (combatting Heartbleed-esque risks)
  - id: "jenkins_cryptography_testing"
    description: "Testing of Cipher and TLS protocol cryptography strength on webapps"
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)ssl_tests"
    map_to: ["A.8.8","A.8.20","A.8.24","A.8.27"]
    confidence: 0.75

  # Application security requirements (A.8.26) - ZAP/SSL strongly supports this
  - id: "jenkins_app_security_requirements"
    description: "ZAP/SSL tests: evidence supporting application security requirements validation."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)\\bzap\\b|\\bssl\\b"
    map_to: ["A.8.26", "A.8.29", "A.8.33"]
    confidence: 0.75

  # Static analysis on PR = secure coding + SDLC + security testing
  - id: "jenkins_static_analysis_on_pr"
    description: "Static analysis on PR: secure coding + SDLC + security testing evidence."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)static_analysis_on_pr|static analysis on pr"
    map_to: ["A.8.28", "A.8.25", "A.8.29"]
    confidence: 0.80

  # Supply chain-ish: dependency scanning (lock files) + backups to other VCS
  - id: "jenkins_supply_chain_dependency_scan"
    description: "Dependency / artifact scanning: supports ICT supply chain + security testing evidence."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)trivy|grype|poetry_lock|lock\\s*file|dependency"
    map_to: ["A.5.21", "A.8.29", "A.8.25"]
    confidence: 0.65

  # Permissions checks (access governance)
  - id: "jenkins_permissions_checks"
    description: "Permission checks (GitHub / Jenkins): supports access control/rights, access to source code, privileged access governance."
    when:
      source: "jenkins"
      action: "test"
      summary_regex: "(?i)github_org_check_permissions|jenkins_check_permissions|check_permissions"
    map_to: ["A.5.15", "A.5.18", "A.8.2", "A.8.3", "A.8.4"]
    confidence: 0.65

  # ECS Tasks Rebalance (capacity management)
  - id: "jenkins_capacity_management"
    description: "ECS Tasks Rebalancer to ensure capacity is managed evenly across redundant physical zones. Fault tolerance"
    when:
      source: "jenkins"
      action: "high_availability"
    map_to: ["A.8.6","A.8.14","A.8.27"]
    confidence: 0.75

  # --- GitHub (SDLC evidence) ---
  - id: "github_push_event"
    description: "Code pushes: SDLC + change management evidence"
    when:
      source: "github"
      action_regex: "(?i)PushEvent|CreateEvent"
    map_to: ["A.8.25","A.8.32","A.8.4"]
    confidence: 0.55

  - id: "github_pr_event"
    description: "Pull requests: change control + review workflow evidence."
    when:
      source: "github"
      action: "PullRequestEvent"
    map_to: ["A.8.32","A.8.25","A.8.29","A.8.4"]
    confidence: 0.60

  - id: "github_pr_review_event"
    description: "PR review submitted/edited/dismissed: review controls evidence"
    when:
      source: "github"
      action: "PullRequestReviewEvent"
    map_to: ["A.8.28","A.8.29","A.8.25","A.8.32"]
    confidence: 0.65

  - id: "github_pr_review_comment_event"
    description: "PR review comment: review controls evidence"
    when:
      source: "github"
      action: "PullRequestReviewCommentEvent"
    map_to: ["A.8.28","A.8.29","A.8.25","A.8.32"]
    confidence: 0.65

  - id: "github_branch_protection_or_rules"
    description: "Repo policy changes: branch protection / rulesets"
    when:
      source: "github"
      action_regex: "(?i)BranchProtectionRuleEvent|RepositoryEvent"
      summary_regex: "(?i)branch protection|ruleset|required status|required review|protected branch"
    map_to: ["A.8.32","A.8.25","A.8.28","A.8.29"]
    confidence: 0.70

  - id: "github_workflow_activity"
    description: "CI/CD evidence from GitHub activity (limited via Events API)"
    when:
      source: "github"
      action_regex: "(?i)CheckRunEvent|CheckSuiteEvent"
    map_to: ["A.8.25","A.8.29","A.8.32"]
    confidence: 0.55

  - id: "github_release_event"
    description: "Release published"
    when:
      source: "github"
      action: "ReleaseEvent"
    map_to: ["A.8.32","A.8.25","A.5.21"]
    confidence: 0.55

  - id: "github_watch_event"
    description: "User is watching a git repository"
    when:
      source: "github"
      action: "WatchEvent"
    map_to: ["A.8.4"]
    confidence: 0.55

  - id: "github_comment_event"
    description: "Comment added - likely evidence of peer review or static analysis/CI results"
    when:
      source: "github"
      action: "IssueCommentEvent"
    map_to: ["A.8.28","A.8.29","A.8.25"]
    confidence: 0.65

  - id: "github_delete_event"
    description: "Deletion of an object in git: software development/workflow/hygiene evidence."
    when:
      source: "github"
      action: "DeleteEvent"
    map_to: ["A.8.32","A.8.25","A.8.4","A.8.10"]
    confidence: 0.60

