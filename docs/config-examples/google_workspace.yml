# Google Workspace audit ingester (Admin SDK Reports API)
#
# Keen polls the Reports API Activities feed and stores each activity as a JSON
# artifact. Map events to iso_27001_2022 controls via config/rules.yml.
#
# Credentials are provided via environment variables (see .env.example):
#   - GOOGLE_WORKSPACE_SA_JSON_B64 (recommended) OR GOOGLE_WORKSPACE_SA_JSON
#   - GOOGLE_WORKSPACE_IMPERSONATE (admin email to impersonate via DWD)
#
# Docs:
# - Admin audit events: application: admin
# - Login audit events: application: login

# If false, ingester will skip regardless of KEEN_GOOGLE_WORKSPACE_ENABLED.
enabled: true

# Optional (can also be set via GOOGLE_WORKSPACE_IMPERSONATE env var)
impersonate: ""

# Defaults used when a stream has no cursor yet.
since_minutes: 120

# Small overlap reduces the chance of missing slightly delayed/out-of-order events.
overlap_seconds: 180

# How long Google can take to report activity. Each run reads this span
# before the present again, so activity reported late is still collected and
# what was stored already is recognised; what it reads again counts towards
# max_items only past ten times that limit. Omitted, it follows Google's
# published lag times: 10 minutes for most applications, 3 hours for
# calendar, groups and user_accounts, and 4 hours for token. Activity reported
# later than this is missed.
# report_lag_seconds: 600

# Most activities read per listing (per named event when a stream lists
# event_names). A busier period is read in narrower time windows, and the
# narrower width is kept until a window of it reads in full. A run that has
# not reached the present reports caught_up: false and how far behind it is
# (behind_seconds), and the next run continues, so a stream busier than this
# each poll can run behind. A minute holding more than this is stored as far
# as it was read, reported as an error and listed in the cursor's
# minutes_over_limit; later runs read it again within the report lag.
max_items: 2000

streams:
  # --- Admin audit: user lifecycle & admin actions
  - name: admin_user_management
    enabled: true
    application: admin
    user_key: all
    system: gws_admin
    # Optional: if omitted, ingests ALL admin audit event types.
    # event_names:
    #   - CREATE_USER
    #   - DELETE_USER
    #   - RENAME_USER
    #   - CHANGE_USER_PASSWORD

  # --- Login audit: sign-in successes & failures
  - name: login_activity
    enabled: true
    application: login
    user_key: all
    system: gws_login
    # Optional filter list. If omitted, ingests ALL login audit event types.
    # event_names:
    #   - login_success
    #   - login_failure
