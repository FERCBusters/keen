# Third-party images are pinned by digest. tools/docker_image_pins.py and the
# Docker image pins workflow keep the digests current.
services:
  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: keen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRES_DB: keen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keen -d keen"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5442:5432"
    networks: [keen]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    command: ["valkey-server", "--requirepass", "${KEEN_REDIS_PASSWORD:-ChangeMe123!}"]
    environment:
      - KEEN_REDIS_PASSWORD=${KEEN_REDIS_PASSWORD:-ChangeMe123!}
    ports:
      - "127.0.0.1:6399:6379"
    networks: [keen]
    restart: unless-stopped

  keen-api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    ports:
      - "127.0.0.1:8181:8080"
    networks: [keen]
    restart: unless-stopped

  keen-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q celery --concurrency=1"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-http-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q ingest-http --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-imap-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [imap]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q imap --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-beat:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app beat -l INFO --schedule=/var/lib/keen/celerybeat-schedule"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - beatdata:/var/lib/keen
    networks: [keen]
    restart: unless-stopped

  keen-ui:
    image: ${KEEN_UI_IMAGE:-ghcr.io/fercbusters/keen-ui:1.0.0}
    depends_on:
      - keen-api
    ports:
      - "127.0.0.1:8081:80"
    networks: [keen]
    restart: unless-stopped

volumes:
  pgdata:
  beatdata:
  artifacts:

networks:
  keen:
    driver: bridge
