# Third-party images are pinned by digest. tools/docker_image_pins.py and the
# Docker image pins workflow keep the digests current.
services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    # Keen's dashboard queries are short, so JIT compilation costs more than it
    # saves. Size the buffer cache, sort memory and planner costs to the host;
    # see .env.example. Parallel queries share memory through /dev/shm.
    command:
      - postgres
      - -c
      - shared_buffers=${KEEN_POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${KEEN_POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${KEEN_POSTGRES_WORK_MEM:-4MB}
      - -c
      - random_page_cost=${KEEN_POSTGRES_RANDOM_PAGE_COST:-4}
      - -c
      - jit=off
    shm_size: ${KEEN_POSTGRES_SHM_SIZE:-256mb}
    environment:
      POSTGRES_USER: keen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a random value}
      POSTGRES_DB: keen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keen -d keen"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5442:5432"
    networks: [keen]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    # The password reaches Valkey in a configuration file written as the
    # container starts. Process arguments are visible to every account on the
    # Docker host, so it is never passed as --requirepass. The image's own
    # entrypoint then starts Valkey as its unprivileged user.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        escaped=$$(printf '%s' "$$KEEN_REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
        printf 'requirepass "%s"\n' "$$escaped" > /tmp/valkey.conf
        chown valkey /tmp/valkey.conf 2>/dev/null || true
        exec docker-entrypoint.sh valkey-server /tmp/valkey.conf
    environment:
      - KEEN_REDIS_PASSWORD=${KEEN_REDIS_PASSWORD:?Set KEEN_REDIS_PASSWORD in .env to a random value}
    ports:
      - "127.0.0.1:6399:6379"
    networks: [keen]
    restart: unless-stopped

  keen-api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    env_file: .env
    environment:
      # Client addresses for sign-in and other per-address limits come through
      # two forwarding hops: the keen-ui nginx container, and the network
      # gateway, where connections to the host's published port arrive (such
      # as from a TLS proxy on the host). Set the variable to override.
      KEEN_SECURITY_TRUSTED_PROXY_CIDRS: ${KEEN_SECURITY_TRUSTED_PROXY_CIDRS:-${KEEN_UI_ADDRESS:-172.30.65.10}/32,${KEEN_NETWORK_GATEWAY:-172.30.65.1}/32}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    ports:
      - "127.0.0.1:8181:8080"
    networks: [keen]
    restart: unless-stopped

  keen-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q celery --concurrency=1"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-http-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q ingest-http --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-imap-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [imap]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q imap --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - artifacts:/app/data/artifacts
    networks: [keen]
    restart: unless-stopped

  keen-beat:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: ${KEEN_API_IMAGE:-ghcr.io/fercbusters/keen-api:1.0.0}
    command: ["bash", "-c", "celery -A app.worker.celery_app beat -l INFO --schedule=/var/lib/keen/celerybeat-schedule"]
    env_file: .env
    depends_on:
      keen-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./frameworks:/app/frameworks:ro
      - beatdata:/var/lib/keen
    networks: [keen]
    restart: unless-stopped

  keen-ui:
    image: ${KEEN_UI_IMAGE:-ghcr.io/fercbusters/keen-ui:1.0.0}
    depends_on:
      - keen-api
    ports:
      - "127.0.0.1:8081:80"
    networks:
      keen:
        ipv4_address: ${KEEN_UI_ADDRESS:-172.30.65.10}
    restart: unless-stopped

volumes:
  pgdata:
  beatdata:
  artifacts:

# A fixed subnet gives the keen-ui proxy and the gateway known addresses for
# KEEN_SECURITY_TRUSTED_PROXY_CIDRS. Where it clashes with another network on
# the host, set KEEN_NETWORK_SUBNET, KEEN_NETWORK_GATEWAY and KEEN_UI_ADDRESS.
networks:
  keen:
    driver: bridge
    ipam:
      config:
        - subnet: ${KEEN_NETWORK_SUBNET:-172.30.65.0/24}
          gateway: ${KEEN_NETWORK_GATEWAY:-172.30.65.1}
