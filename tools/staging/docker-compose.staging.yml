# Staging override for docker-compose.yml; keen-staging adds it automatically.
#
# The base Compose file pins the network and trusts exactly two forwarding
# hops: the UI nginx container and the network gateway, where connections from
# the TLS front through the host's 127.0.0.1:8081 port arrive.
services:
  keen-worker:
    # One worker process keeps a small (2 GB) staging host within memory.
    command: ["bash", "-c", "celery -A app.worker.celery_app worker -l INFO -Q celery --concurrency=1"]
