target-version = "py311"
line-length = 88

[lint]
select = [
    "E4", "E7", "E9", # Basic Python errors
    "F",              # Undefined names, unused imports, etc.
    "I",              # Import sorting
    # Security (flake8-bandit), limited to patterns that are almost always a
    # defect: evaluating code or data, unsafe deserialisers and XML parsers,
    # disabled or outdated TLS, shell commands, SQL assembled from strings,
    # template engines without escaping, weak hashes, non-cryptographic random
    # numbers and HTTP calls without a timeout. A line that is safe nonetheless
    # carries "# noqa: <rule>" with the reason beside it.
    "S102", "S113", "S301", "S302", "S307", "S310", "S311", "S313", "S314",
    "S315", "S316", "S317", "S318", "S319", "S323", "S324", "S501", "S502",
    "S503", "S504", "S505", "S506", "S507", "S508", "S509", "S601", "S602",
    "S604", "S605", "S608", "S609", "S612", "S701", "S702", "S704",
]

[lint.per-file-ignores]
# These modules set default environment values and the scripts path before
# importing the application, so they also run on their own outside tests.sh.
"services/api/tests/test_demo_seed_crosswalk.py" = ["E402"]
"services/api/tests/test_mitigator_catalogue.py" = ["E402"]
# The XML parsing boundary itself; the rest of the application parses through it.
"services/api/app/security/xml.py" = ["S314"]
# Migrations are fixed operator code: their SQL names tables from their own
# constants and binds every value.
"services/api/alembic/**" = ["S608"]
# Tests build fixture SQL from constants, compare the XML boundary with the
# standard parser and draw predictable random data, as do the demo seeds and
# the fuzzers.
"services/api/tests/**" = ["S311", "S314", "S608"]
"services/api/scripts/demo_*.py" = ["S311"]
"tools/security_e2e/**" = ["S311"]
"tools/security_fuzz/**" = ["S311"]
