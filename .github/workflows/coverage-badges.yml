name: Coverage badges

# Runs after a successful KEEN CI push to main and publishes coverage badges to
# the orphan "badges" branch. Kept separate from tests.yml so the reusable test
# workflow (called by release.yml) never needs write permission.
on:
  workflow_run:
    workflows: ["KEEN CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-badges
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: repo

      - name: Download coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: keen-test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: results

      - name: Render badges
        run: |
          set -eu
          script=repo/tools/coverage_badges.py
          [ -f "$script" ] || script=repo/keen/tools/coverage_badges.py
          python3 -I "$script" results "$RUNNER_TEMP/badges"

      - name: Publish to badges branch
        working-directory: repo
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan badges
          cp "$RUNNER_TEMP"/badges/*.svg .
          git add -- *.svg
          git commit --quiet -m "Coverage badges for ${HEAD_SHA}"
          if git fetch --quiet --depth=1 origin badges &&
             [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
            echo 'Badges unchanged.'
            exit 0
          fi
          git push --force origin badges
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
